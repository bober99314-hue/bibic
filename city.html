<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Этос — живой город</title>
  <style>
    body { margin: 0; padding: 24px; background: #f5f2eb; }
    main { max-width: 1100px; margin: auto; }
    @media (max-width: 600px) { body { padding: 12px; } }
  </style>
  <!-- COMPONENT CSS: copy this block into your project. -->
  <style id="city-component-styles">
/* All styles are scoped so the component can be embedded in another page. */
.ethos-city {
  margin: 0 0 28px;
  padding: 26px 28px 20px;
  color: #555b50;
  background: #fcfaf6;
  border: 1px solid #e3dfd4;
  border-radius: 10px;
  font: 14px/1.6 Arial, sans-serif;
}
.ethos-city * { box-sizing: border-box; }
.ethos-city .city-heading { display: flex; justify-content: space-between; gap: 18px; align-items: center; }
.ethos-city .city-eyebrow { margin: 0 0 4px; color: #898778; font-size: 9px; letter-spacing: 2px; }
.ethos-city h2 { margin: 0; font: 26px/1.3 Georgia, serif; color: #30352b; }
.ethos-city .city-state { margin: 0; padding: 6px 12px; border: 1px solid #deded5; border-radius: 20px; font-size: 11px; white-space: nowrap; }
.ethos-city .city-state.is-active { color: #8d721f; border-color: #d4af37; background: #fbf5df; }
.ethos-city svg { display: block; width: 100%; height: auto; max-height: 520px; margin: 8px auto 0; overflow: visible; }
/* Ordinary and ideal days have exactly two colors; no intermediate state. */
#ancient-city { fill: none; stroke: #9b9d96; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#ancient-city.active-city { stroke: #d4af37; filter: drop-shadow(0 0 2px #d4af372b); }
#ancient-city .city-build { opacity: 0; transition: opacity 0.5s ease; }
#ancient-city .city-build.visible { opacity: 1; }
#ancient-city .fine-line { stroke-width: 1; }
#ancient-city #road-guides { opacity: 0.22; }
#ancient-city #roads.paved #road-guides { opacity: 1; }
/* Effects switch off immediately, independent of the construction transition. */
#ancient-city #fx-elements { opacity: 0; visibility: hidden; transition: none; }
#ancient-city.active-city #fx-elements { opacity: 1; visibility: visible; }
#ancient-city .flame { transform-box: fill-box; transform-origin: center bottom; animation: city-flame 1.4s ease-in-out infinite alternate; animation-play-state: paused; }
#ancient-city .flame-inner { animation-delay: -0.7s; animation-duration: 1s; }
#ancient-city .water-stream { stroke-dasharray: 5 7; animation: city-water 1.2s linear infinite; animation-play-state: paused; }
#ancient-city .water-ripple { transform-box: fill-box; transform-origin: center; animation: city-ripple 2s ease-out infinite; animation-play-state: paused; }
#ancient-city.active-city .flame,
#ancient-city.active-city .water-stream,
#ancient-city.active-city .water-ripple { animation-play-state: running; }
.ethos-city .city-caption { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; border-top: 1px solid #e3dfd4; padding-top: 15px; }
.ethos-city .city-caption p { margin: 0; font-size: 12px; }
.ethos-city .city-caption strong { font-weight: 600; color: #555b50; }
.ethos-city .city-progress { width: 100%; height: 4px; display: block; margin-top: 12px; border: 0; border-radius: 4px; overflow: hidden; background: #e8e5dc; accent-color: #92978a; }
.ethos-city .city-progress::-webkit-progress-bar { background: #e8e5dc; }
.ethos-city .city-progress::-webkit-progress-value { background: #92978a; }
.ethos-city .city-progress::-moz-progress-bar { background: #92978a; }
.ethos-city:has(.active-city) .city-progress { accent-color: #d4af37; }
.ethos-city:has(.active-city) .city-progress::-webkit-progress-value { background: #d4af37; }
.ethos-city:has(.active-city) .city-progress::-moz-progress-bar { background: #d4af37; }
.ethos-city .city-hint { margin: 10px 0 0; font-size: 11px; color: #868779; }
@keyframes city-flame { from { opacity: .5; transform: scale(.88, .9) rotate(-3deg); } to { opacity: 1; transform: scale(1.05, 1.13) rotate(3deg); } }
@keyframes city-water { to { stroke-dashoffset: -24; } }
@keyframes city-ripple { from { opacity: .8; transform: scaleX(.8); } to { opacity: 0; transform: scaleX(1.12); } }
@media (max-width: 600px) {
  .ethos-city { padding: 20px 14px 16px; }
  .ethos-city h2 { font-size: 23px; }
  .ethos-city .city-heading { align-items: flex-start; gap: 10px; }
  .ethos-city .city-state { font-size: 10px; padding: 5px 8px; }
  .ethos-city .city-caption { flex-wrap: wrap; gap: 4px; }
  .ethos-city svg { margin-top: 18px; }
  #ancient-city { stroke-width: 2; }
  #ancient-city .fine-line { stroke-width: 1.5; }
}
@media (prefers-reduced-motion: reduce) {
  #ancient-city .city-build { transition: none; }
  #ancient-city .flame, #ancient-city .water-stream, #ancient-city .water-ripple { animation: none; }
}
  </style>
</head>
<body>

<!-- COMPONENT JAVASCRIPT: load after the SVG. -->
<script id="city-component-script">
/**
 * Public API: EthosCity.refresh() or EthosCity.update({ totalCompleted, allDoneToday }).
 * Storage contract: totalCompleted = "0"…"100"; allDoneToday = "true" | "false".
 * No dependencies. All dates and habit counting remain the host application's responsibility.
 */
(() => {
  'use strict';
  const svg = document.getElementById('ancient-city');
  if (!svg) return;
  const stages = [
    { from: 0, title: 'Рождение фундамента' },
    { from: 26, title: 'Возведение колоннады' },
    { from: 51, title: 'Свод и окружение' },
    { from: 76, title: 'Триумф и венец творения' },
  ];
  const groups = [...svg.querySelectorAll('.city-build[data-at]')];

  function normalize(values = {}) {
    const number = Number(values.totalCompleted);
    return {
      totalCompleted: Number.isFinite(number) ? Math.min(100, Math.max(0, Math.floor(number))) : 0,
      // Boolean("false") is true: compare explicitly instead.
      allDoneToday: values.allDoneToday === true || values.allDoneToday === 'true',
    };
  }

  function readStorage() {
    try {
      return normalize({
        totalCompleted: localStorage.getItem('totalCompleted'),
        allDoneToday: localStorage.getItem('allDoneToday'),
      });
    } catch {
      return normalize();
    }
  }

  function paint(values) {
    const { totalCompleted: total, allDoneToday: active } = normalize(values);
    groups.forEach(group => {
      const visible = total >= Number(group.dataset.at);
      group.classList.toggle('visible', visible);
      group.setAttribute('aria-hidden', String(!visible));
    });
    svg.querySelector('#roads').classList.toggle('paved', total >= 6);
    svg.classList.toggle('active-city', active);
    const stage = stages.filter(item => total >= item.from).at(-1).title;
    const goldenEra = total === 100 && active;
    document.getElementById('city-stage').textContent = goldenEra ? 'Вечная Золотая эра' : stage;
    document.getElementById('city-total').textContent = total;
    document.getElementById('city-progress').value = total;
    const status = document.getElementById('city-state');
    status.textContent = active ? 'Идеальный день' : 'Город отдыхает';
    status.classList.toggle('is-active', active);
    document.getElementById('city-hint').textContent = active
      ? 'Все привычки сегодня выполнены. Ваш город живёт.'
      : 'Выполните все привычки сегодня, чтобы зажечь город.';
    document.getElementById('city-svg-description').textContent =
      `${goldenEra ? 'Вечная Золотая эра' : stage}. Выполнено ${total} из 100 привычек. ${active ? 'Золотые контуры, огонь и вода в построенных фонтанах.' : 'Серые контуры. Огонь и вода выключены.'}`;
  }

  function refresh() { paint(readStorage()); }

  function update(values) {
    const normalized = normalize(values);
    let saved = true;
    try {
      localStorage.setItem('totalCompleted', String(normalized.totalCompleted));
      localStorage.setItem('allDoneToday', String(normalized.allDoneToday));
    } catch {
      saved = false;
    }
    // Still display the current state when storage is unavailable.
    paint(normalized);
    return saved;
  }

  window.EthosCity = Object.freeze({ refresh, update });
  window.addEventListener('storage', event => {
    if (event.key === null || ['totalCompleted', 'allDoneToday'].includes(event.key)) refresh();
  });
  // Same-tab setItem does not fire 'storage': call refresh or dispatch this event.
  window.addEventListener('ethos:city-update', refresh);
  refresh();
})();
</script>
</body>
</html>
